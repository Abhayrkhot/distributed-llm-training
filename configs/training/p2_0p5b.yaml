# Phase 2 correctness runs: pretrained Qwen2.5-0.5B continued on FineWeb-Edu.
# data is passed on the command line (--set data=$DLT_HOME/data/fineweb-edu-000/train.bin).
model: Qwen/Qwen2.5-0.5B
init: pretrained
seq_len: 2048
global_batch: 16
micro_batch: 4
steps: 50
lr: 3.0e-5
warmup_steps: 5
weight_decay: 0.1
grad_clip: 1.0
seed: 0
