[project]
name = "dlt"
version = "0.1.0"
description = "Distributed LLM training on Explorer H200s"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # torch 2.14.1 + CUDA 12.6: the H200 nodes run driver 570.86.15 (CUDA 12.8), and torch 2.13+
    # no longer ships cu128 wheels; cu126 runs natively, CUDA 13 builds would need compat libraries.
    "torch==2.14.1",
    "transformers==5.24.0",
    "peft==0.22.0",
    "bitsandbytes==0.50.2",
    "accelerate==1.16.0",
    "safetensors>=0.6",
    "huggingface-hub>=1.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
